[project]
name = "thirukkural"
version = "2.0.0"
description = "Thirukkural reader with Tamil narration, plus Thirukkural AI: multilingual semantic search, a grounded LLM tutor and voice questions"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["migrations", "static", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
